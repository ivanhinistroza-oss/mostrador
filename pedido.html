<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0d6e5f">
  <title>Seguimiento de pedido · Mostrador</title><link rel="stylesheet" href="./css/estilos.css">
  <style>
    html,body{height:auto!important;overflow:auto!important}body{margin:0;padding:28px 16px 48px}.portal-logo{width:56px;height:56px;border-radius:14px;object-fit:contain;background:#fff;border:1px solid var(--line)}.portal{max-width:780px;margin:auto}.portal-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.portal-mark{width:42px;height:42px;border-radius:13px;background:var(--accent);color:white;display:grid;place-items:center;font:700 21px var(--f-display)}.portal-head b{font:700 20px var(--f-display)}.portal-head small{display:block;color:var(--muted)}.portal-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 5px 24px rgb(20 45 35 / .05)}.portal-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.portal-title h1{margin:0;font:700 24px var(--f-display)}.portal-status{display:inline-flex;border-radius:999px;padding:6px 12px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}.portal-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.portal-meta div{border-radius:11px;background:var(--surface-2);padding:12px}.portal-meta small,.portal-meta b{display:block}.portal-meta small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.portal-meta b{margin-top:3px}.portal-card h2{font-size:16px;margin:0 0 12px}.portal-lines{display:grid;gap:8px}.portal-line{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:9px 0}.portal-line:last-child{border:0}.portal-line small{display:block;color:var(--muted)}.portal-timeline{display:grid;gap:0}.portal-step{position:relative;display:grid;grid-template-columns:22px 1fr;gap:10px;padding:0 0 18px}.portal-step:last-child{padding-bottom:0}.portal-step i{width:12px;height:12px;border-radius:50%;background:var(--accent);margin:4px 0 0 4px;box-shadow:0 0 0 4px var(--accent-soft)}.portal-step:not(:last-child):after{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--line)}.portal-step b,.portal-step small{display:block}.portal-step small{color:var(--muted);margin-top:2px}.portal-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.portal-photos figure{margin:0}.portal-photos img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:11px;border:1px solid var(--line)}.portal-photos figcaption{font-size:12px;color:var(--muted);margin-top:4px}.portal-error{text-align:center;padding:38px 20px}.portal-error h1{font:700 22px var(--f-display)}.portal-foot{text-align:center;color:var(--muted);font-size:12px}.portal-loading{padding:48px;text-align:center;color:var(--muted)}@media(max-width:520px){body{padding:18px 12px 34px}.portal-card{padding:17px}.portal-title{display:grid}.portal-meta{grid-template-columns:1fr}.portal-title h1{font-size:21px}}
  </style>
</head>
<body><main id="portal" class="portal"><div class="portal-loading">Cargando seguimiento…</div></main><script type="module" src="./js/portal-pedido.js"></script></body>
</html>
